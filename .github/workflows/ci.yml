name: CI
on:
  push:
    branches: [main, rombak-ringan]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trupest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Server (typecheck + tes)
        working-directory: server
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/trupest_test
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Client (build)
        working-directory: client
        run: |
          npm ci
          npm run build
